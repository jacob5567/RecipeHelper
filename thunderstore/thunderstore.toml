# Thunderstore CLI (tcli) settings for publishing. The release workflow uploads the zip from the GitHub release, so
# the package contents, version and dependencies come from that zip's manifest.json; this file only says where it goes.
[config]
schemaVersion = "0.0.1"

[package]
namespace = "sevenstack"
name = "RecipeHelper"
description = "Shows a sidebar in the Wandering CHEF crafting dialog listing everything you can craft, including through several crafts in a row. Click one to fill the slots. Client-side."
websiteUrl = "https://github.com/jacob5567/RecipeHelper"
containsNsfwContent = false

[publish]
repository = "https://thunderstore.io"
communities = ["riskofrain2"]

[publish.categories]
riskofrain2 = ["mods", "client-side", "tweaks", "ai-generated"]
